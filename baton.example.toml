# baton host configuration. Copy to ~/.config/baton/baton.toml (or pass --config) and edit.
# Every path, host name and credential lives here; nothing is built into baton.

[host]
# The URL clients use to reach this host, without /mcp. For local use only:
public_url = "http://127.0.0.1:8765"
listen_host = "127.0.0.1"
listen_port = 8765
data_dir = "~/.local/share/baton"
# Extra browser origins allowed to call /mcp (rarely needed).
# allowed_origins = ["https://client.example.com"]

# Roles are the names agents act as. Each credential maps to exactly one role.
[roles.planner]
description = "Breaks work into jobs and reviews results"

[roles.worker]
description = "Picks up jobs and reports back"

# Optional: a person rather than an agent. A human role uses only its own bearer token (never OAuth or --as),
# and its messages read as author_kind "human". See the README's "Human participants".
# human = true
# display_name = "Alex Rivera"   # how pages name the role, such as a person's name; the role name when unset

# Optional: an identity that only displays, such as the dashboard's viewer. It never holds a token, an OAuth
# grant or --as, and can't also be human.
# [roles.viewer]
# display_only = true

# Optional, with [conversations] enabled: what a role may do in group conversations (both default to false).
# can_create_conversations = true
# can_manage_participants = true
# can_view_all_conversations = true   # grants retained board-wide reads; also lets the dashboard show every conversation

# Optional: wake a role when something is waiting for it. Use one of: a webhook, a command, an integration.
# [roles.worker.wake]
# webhook = "https://hooks.example.com/baton"
# secret_env = "BATON_WORKER_WEBHOOK_SECRET"   # signs with Standard Webhooks when set
# command = ["/usr/local/bin/notify-worker"]   # argv, no shell; the wake JSON arrives on stdin
# integration = "<name>"                       # an enabled integration; see docs/integrations/
# timeout_seconds = 10
# only_when_addressed = true                   # still receives every message, but a conversation message
#                                              # wakes it only when it names the role in attention or asks
#                                              # for a decision. Direct messages and job changes still do.

# Optional: group conversations among three or more roles. Off unless enabled.
# [conversations]
# enabled = true
# max_participants = 8                        # per conversation, at least 2
# max_messages_per_hour = 30                  # per conversation; past it, sends are refused
# escalation_role = "planner"                 # woken at most once an hour while a conversation is over its limit

# Optional: a read-only web view of conversations, served by the host on loopback only. Off unless enabled.
# It has no login: anyone or any process on this machine that can reach the port can read it.
# [dashboard]
# enabled = true                              # needs [conversations] enabled
# viewer_role = "viewer"                      # shows what this role may see; it must be display_only
# listen_host = "127.0.0.1"                   # 127.0.0.1 or ::1 only
# listen_port = 8766
# proxy_host = "dash.example.com:8443"       # optional: one exact extra Host, only behind an authenticating proxy

# Optional: a browser seat, where one human role logs in with its own token to read and reply. Off unless enabled.
# It binds to loopback only, behind a proxy that terminates TLS at `origin`. See the README's "Browser seat".
# [seat]
# enabled = true
# role = "operator"                           # a human role, not display_only, and not the dashboard's viewer
# origin = "https://seat.example.com"         # the one exact https origin it's opened at; give it its own host name
# same_host_trust_accepted = false            # true only to accept a host name shared with other services
# listen_host = "127.0.0.1"                   # 127.0.0.1 or ::1 only
# listen_port = 8767
# idle_seconds = 3600                         # a session ends after this long unused (60 to 86400)
# absolute_seconds = 43200                    # and after this long in all (60 to 604800)
# timezone = "UTC"                            # the IANA zone pages show times in, such as "America/Chicago"

# Optional: keyword search over messages, and derived artifacts from the local indexer. Off unless enabled.
# Each role finds only what it may read.
# [search]
# enabled = true
# rolling_window_messages = 0                 # 0 is off; else producers may write summary_recent over this many latest
# max_vector_dim = 1024                       # the largest dimension an embedding profile may declare (1-16384)
# embeddings = false                          # true: generations may embed, commits carry vectors, search re-ranks

# Optional: the host owner's local indexing worker. Empty `producers` turns the writer off.
# [indexer]
# producers = ["indexer"]                     # the producer names the writer commands act as (not role names)
# max_artifact_bytes = 16384                  # per artifact body
# max_citations = 64                          # messages one artifact may cite
# max_manifest_items = 500                    # messages one batch may serve
# max_manifest_segments = 64                  # seq ranges one batch may serve
# page_items = 100                            # messages per page when a batch is read
# max_open_batches = 4                        # per producer at once
# batch_ttl_seconds = 900                     # an open batch expires after this
# max_input_segments = 256                    # seq ranges one artifact's inputs may span
# max_commits_per_hour = 60                   # per producer
# receipt_retention_days = 30                 # commit receipts kept for retries
# cleanup_batch = 100                         # rows removed per cleanup pass
# max_generations = 3                         # per producer, the active one included
# generation_retention_days = 30              # a retired generation is removed after this
# max_activation_reconcile = 10000            # (conversation, kind) pairs one activation may check
# max_vectors_per_generation = 1000000        # vectors one generation may hold; past it a commit is refused

# Bearer tokens: create with `baton token new --name <name> --role <role>` and paste the printed entry.
# [[auth.tokens]]
# name = "worker-laptop"
# role = "worker"
# sha256 = "<64 hex characters>"

# Optional OAuth 2.1 for remote MCP clients that support it.
# [auth.oauth]
# enabled = true
# passphrase_hash = "scrypt$..."               # from `baton hash-passphrase`; or passphrase_hash_env = "VAR"
# roles = ["planner"]                          # roles the consent page may grant
# redirect_uris = ["https://client.example.com/oauth/callback"]   # exact matches
# allow_loopback_redirects = true              # http://127.0.0.1:<any port>/... for desktop clients

# Job states. Omit this table for the default: open -> working -> done | failed | cancelled.
# Optional: push a content-free notice when a decision is waiting for one role. See
# docs/integrations/decision-push.md.
# [integrations.decision_push]
# enabled = true
# role = "planner"
# url = "https://push.example.com/decisions"
# secret_env = "BATON_PUSH_TOKEN"            # optional: a bearer token, read from the environment
# link_base = "https://dash.example.com"     # optional: link each push to the dashboard item
# max_per_hour = 10

[jobs]
initial = "open"

[jobs.states.open]
waiting_on = "worker"
next = ["working", "cancelled"]

[jobs.states.working]
waiting_on = "worker"
next = ["review", "cancelled"]

[jobs.states.review]
waiting_on = "planner"
next = ["done", "working"]

[jobs.states.done]

[jobs.states.cancelled]
