[project]
name = "baton"
version = "0.1.0"
description = "A small MCP host that relays messages and job state between agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "httpcore>=1.0.9,<2",
    "mcp>=2.3.0,<3",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
baton = "baton.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.17.3",
    "ty==0.0.97",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "baton"
module-root = ""

[tool.ruff]
required-version = "==0.17.3"
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF100", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Scenario tests keep their setup, actions, and assertions together.
"tests/**/*.py" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty]
# Existing findings stay visible here; CI rejects diagnostics outside this baseline.
baseline = "ty-baseline.json"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["baton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
